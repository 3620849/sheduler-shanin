services:
  mysql-test:
    image: mysql:8.4
    container_name: scheduler-mysql-test
    environment:
      MYSQL_DATABASE: scheduler_test_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: appsecret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - mysql-test-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      scheduler-test-network:
        aliases:
          - mysql-test

  rabbitmq-test:
    image: rabbitmq:4-management-alpine
    container_name: scheduler-rabbitmq-test
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-test-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      scheduler-test-network:
        aliases:
          - rabbitmq-test

  backend-api-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: scheduler-backend:latest
    container_name: scheduler-backend-api-test
    ports:
      - "8081:8080"
    environment:
      MYSQL_HOST: mysql-test
      MYSQL_PORT: 3306
      MYSQL_DATABASE: scheduler_test_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: appsecret
      RABBITMQ_HOST: rabbitmq-test
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-test:3306/scheduler_test_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: appsecret
      SPRING_RABBITMQ_HOST: rabbitmq-test
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SCHEDULER_ENABLED: "true"
      WORKER_ENABLED: "false"
    depends_on:
      mysql-test:
        condition: service_healthy
      rabbitmq-test:
        condition: service_healthy
    restart: unless-stopped
    networks:
      scheduler-test-network:
        aliases:
          - backend-api

  backend-worker-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: scheduler-backend:latest
    container_name: scheduler-backend-worker-test
    environment:
      MYSQL_HOST: mysql-test
      MYSQL_PORT: 3306
      MYSQL_DATABASE: scheduler_test_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: appsecret
      RABBITMQ_HOST: rabbitmq-test
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-test:3306/scheduler_test_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: appsecret
      SPRING_RABBITMQ_HOST: rabbitmq-test
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SCHEDULER_ENABLED: "false"
      WORKER_ENABLED: "true"
      SPRING_QUARTZ_AUTO_STARTUP: "false"
      SPRING_QUARTZ_JDBC_INITIALIZE_SCHEMA: "never"
    depends_on:
      mysql-test:
        condition: service_healthy
      rabbitmq-test:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - scheduler-test-network

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: scheduler-frontend:latest
    container_name: scheduler-frontend-test
    ports:
      - "8082:80"
    depends_on:
      - backend-api-test
    restart: unless-stopped
    networks:
      - scheduler-test-network

networks:
  scheduler-test-network:
    driver: bridge

volumes:
  mysql-test-data:
    driver: local
  rabbitmq-test-data:
    driver: local
